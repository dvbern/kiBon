<h2 mat-dialog-title class="tw:text-center">
    {{ 'LOCALLOGIN_PASSWORD' | translate }}
</h2>

<mat-dialog-content class="password-dialog-content">
    <mat-form-field appearance="outline" class="password-field">
        <mat-label>{{ 'LOCALLOGIN_PASSWORD' | translate }}</mat-label>
        <input
            matInput
            type="password"
            [(ngModel)]="password"
            (keyup.enter)="submit()"
            cdkFocusInitial
        />
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="center" class="password-action-content">
    <button class="dv-btn cancel-button" (click)="cancel()">
        {{ 'CANCEL' | translate }}
    </button>
    <button class="dv-btn tw:ml-2" (click)="submit()">
        {{ 'LABEL_OK' | translate }}
    </button>
</mat-dialog-actions>
