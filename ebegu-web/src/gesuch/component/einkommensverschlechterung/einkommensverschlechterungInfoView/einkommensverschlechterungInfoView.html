<div class="einkommensverschlechterung-info gesuch-modul static-position">
    <h1 class="access-for-all-title" data-translate="AFA_GESUCHSFORMULAR"></h1>
    <div class="row view-title">
        <div class="col-md-12">
            <h2 data-test="page-title">
                <span data-translate="EINKOMMENSVERSCHLECHTERUNG"></span>
            </h2>
            <hr class="header" />
        </div>
    </div>
    <div
        ng-if="vm.showWarningAngabenVervollstaendigen()"
        class="well well-status-warten"
    >
        <i class="fa fa-exclamation-triangle" aria-hidden="true"></i
        ><span translate>WARNUNG_GS2_AUSFUELLEN</span>
    </div>
    <div ng-if="!vm.showWarningAngabenVervollstaendigen()">
        <div class="row" ng-if="vm.warningEinkommenTooHighVisible()">
            <div class="col-xs-12">
                <div class="well well-status-warten minus-margin">
                    <i
                        class="fa fa-exclamation-triangle"
                        aria-hidden="true"
                    ></i>
                    <span
                        data-translate="EINKOMMENSVERSCHLECHTERUNG_EINKOMMEN_TOO_HIGH"
                        data-translate-values="{{
                            vm.getMaxEinkommenTranslateValues()
                        }}"
                    >
                    </span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <form
                    role="form"
                    name="vm.form"
                    class=""
                    unsaved-warning-form=""
                    novalidate
                >
                    <div
                        class="row"
                        ng-if="!vm.isFinanzielleSituationRequired()"
                    >
                        <div class="col-md-12">
                            <p>
                                <span data-translate="EKV_FIN_SIT_NOT_REQUIRED">
                                </span>
                            </p>
                        </div>
                    </div>

                    <div ng-if="vm.isFinanzielleSituationRequired()">
                        <fieldset ng-disabled="vm.isGesuchReadonly()">
                            <!--Einkommensverschlechterung-->
                            <div class="row">
                                <div
                                    class="col-xs-12 dv-input-container-question"
                                >
                                    <div class="form-group">
                                        <span class="ebegu-h1 required">
                                            <span
                                                data-translate="EKVI_EINKOMMENSVERSCHLECHTERUNG_JA_NEIN"
                                                data-translate-values="{{
                                                    vm.getBasisJahrUndPeriode()
                                                }}"
                                            ></span>
                                            <dv-tooltip
                                                input-id="eingeschrieben-tooltip"
                                                text="'EKVI_EINKOMMENSVERSCHLECHTERUNG_JA_NEIN_HINT' | translate"
                                            ></dv-tooltip>
                                        </span>
                                        <dv-radio-container
                                            name="einkommensverschlechterung"
                                            ng-model="vm.getEinkommensverschlechterungsInfo().einkommensverschlechterung"
                                            ng-change="vm.onEinkommensverschlechterungChange()"
                                            ng-required="true"
                                            class="radio input-element"
                                            dv-enable-element
                                            dv-enable-allowed-roles="vm.allowedRoles"
                                            dv-enable-expression="!vm.isGesuchReadonly() && !vm.isKorrekturModusJugendamt()"
                                            aria-label="{{
                                                'EKVI_EINKOMMENSVERSCHLECHTERUNG_JA_NEIN'
                                                    | translate
                                            }}"
                                            aria-described-by="einkommensverschlechterung-radio-error"
                                        >
                                        </dv-radio-container>
                                        <dv-error-messages
                                            input-id="einkommensverschlechterung-radio"
                                            for="vm.form.einkommensverschlechterung.$error"
                                            class="error"
                                        ></dv-error-messages>
                                    </div>
                                </div>
                            </div>

                            <!-- Auswahl Basisjahr Plus 1 -->
                            <div class="row">
                                <div
                                    class="form-group no-margin col-xs-12 dv-input-container-question"
                                    ng-if="vm.showEkvi()"
                                >
                                    <p
                                        class="inline-hint margin-bottom-30"
                                        data-translate="EKVI_EINKOMMENSVERSCHLECHTERUNG_HELP_TEXT"
                                        data-translate-values="{{
                                            vm.getBasisJahrUndPeriode()
                                        }}"
                                    ></p>

                                    <div class="checkbox no-margin-bottom">
                                        <md-checkbox
                                            name="ekvFuerBasisJahrPlus1"
                                            data-test="ekv-fuer-basis-jahr-plus#1"
                                            ng-model="vm.getEinkommensverschlechterungsInfo().ekvFuerBasisJahrPlus1"
                                            aria-label="{{
                                                vm.getBasisjahrPlus1()
                                            }}"
                                            ng-required="vm.isRequired(1)"
                                            class="input-element"
                                            ng-disabled="vm.isGesuchReadonly() || vm.isKorrekturModusJugendamt()"
                                        >
                                            <span
                                                data-translate="EKVI_FUER_JAHR"
                                                data-translate-value-basisjahr="{{
                                                    vm.getBasisjahrPlus1()
                                                }}"
                                            ></span>
                                        </md-checkbox>
                                    </div>
                                </div>
                            </div>

                            <!-- Ablehnung durch JA fuer Basisjahr plus 1 -->
                            <div
                                class="row"
                                ng-if="vm.showAblehnungBasisJahrPlus1()"
                            >
                                <div class="form-group col-sm-12">
                                    <div class="checkbox">
                                        <md-checkbox
                                            name="ekvBasisJahrPlus1Annulliert"
                                            data-test="ekv-basis-jahr-plus#1-annulliert"
                                            ng-model="vm.getEinkommensverschlechterungsInfo().ekvBasisJahrPlus1Annulliert"
                                            aria-label="{{
                                                'EKVI_ABLEHNEN' | translate
                                            }}"
                                            class="input-element"
                                            ng-disabled="vm.isGesuchReadonly()"
                                        >
                                            <span
                                                data-translate="EKVI_ABLEHNEN"
                                            ></span>
                                        </md-checkbox>
                                    </div>
                                    <hr class="header" />
                                </div>
                            </div>

                            <!-- Auswahl Basisjahr Plus 2 -->
                            <div class="row">
                                <div
                                    class="form-group no-margin col-sm-12 dv-input-container-question"
                                    ng-if="vm.showJahrPlus2()"
                                >
                                    <div>
                                        <md-checkbox
                                            name="ekvFuerBasisJahrPlus2"
                                            data-test="ekv-fuer-basis-jahr-plus#2"
                                            ng-model="vm.getEinkommensverschlechterungsInfo().ekvFuerBasisJahrPlus2"
                                            aria-label="{vm.getBasisjahrPlus2()}"
                                            ng-required="vm.isRequired(2)"
                                            class="input-element"
                                            ng-disabled="vm.isGesuchReadonly() || vm.isKorrekturModusJugendamt()"
                                        >
                                            <span
                                                data-translate="EKVI_FUER_JAHR"
                                                data-translate-value-basisjahr="{{
                                                    vm.getBasisjahrPlus2()
                                                }}"
                                            ></span>
                                        </md-checkbox>
                                    </div>
                                </div>
                            </div>

                            <!-- Ablehnung durch JA fuer Basisjahr plus 2 -->
                            <div
                                class="row"
                                ng-if="vm.showAblehnungBasisJahrPlus2()"
                            >
                                <div
                                    class="form-group col-sm-12 dv-input-container-medium"
                                >
                                    <div class="checkbox no-margin-bottom">
                                        <md-checkbox
                                            name="ekvBasisJahrPlus2Annulliert"
                                            data-test="ekv-basis-jahr-plus#2-annulliert"
                                            ng-model="vm.getEinkommensverschlechterungsInfo().ekvBasisJahrPlus2Annulliert"
                                            aria-label="{{
                                                'EKVI_ABLEHNEN' | translate
                                            }}"
                                            class="input-element"
                                            ng-disabled="vm.isGesuchReadonly()"
                                        >
                                            <span
                                                data-translate="EKVI_ABLEHNEN"
                                            ></span>
                                        </md-checkbox>
                                    </div>
                                </div>
                            </div>
                            <div
                                ng-if="vm.showYearsErrorMessage()"
                                class="dv-error-messages margin-top-10"
                            >
                                <div role="alert" class="error">
                                    <div
                                        data-translate="ERROR_REQUIRED_ONE_OF_THEM"
                                        class="inline-block"
                                    ></div>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <!-- -------------------------------------------Navigation--------------------------------------------  -->
                    <dv-navigation
                        can-go-previous="true"
                        can-go-next="true"
                        dv-save="vm.confirmAndSave()"
                        dv-sub-step="1"
                    >
                    </dv-navigation>
                </form>
            </div>
        </div>
    </div>
</div>
