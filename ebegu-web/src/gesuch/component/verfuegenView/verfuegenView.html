<div class="verfuegen-view gesuch-modul static-position">
    <h1 class="access-for-all-title" data-translate="AFA_GESUCHSFORMULAR"></h1>
    <div class="row">
        <div class="col-md-12">
            <form
                role="form"
                name="vm.form"
                class=""
                novalidate
                unsaved-warning-form
            >
                <!-- Titel -->
                <div class="row margin-top-40">
                    <div class="col-md-8">
                        <h3 class="ebegu-h2" class="main-title">
                            {{ vm.getKindName() }} /
                            {{ vm.getInstitutionName() }}
                        </h3>
                    </div>
                    <div class="col-md-4 text-right">
                        <h3 class="ebegu-h2" aria-hidden class="main-title">
                            {{ vm.getBetreuungNumber() }}
                        </h3>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <hr class="header" />
                    </div>
                </div>

                <!-- Status -->
                <div class="row">
                    <div class="col-md-12">
                        <div
                            class="betreuung-status verfuegen-view ng-class:vm.getBetreuungsstatus();"
                        >
                            <div
                                data-test="verfuegen-status"
                                ng-bind="vm.getBetreuungsstatus() | translate"
                            ></div>
                            <span class="betreuung-bar"></span>
                        </div>
                    </div>
                </div>

                <!-- Verfuegung Tagesschule -->
                <div
                    ng-if="
                        vm.isTagesschuleVerfuegung() &&
                        !vm.getBetreuung().keineDetailinformationen
                    "
                >
                    <br />
                    <!-- Eintrittsdatum -->
                    <div class="row">
                        <div
                            class="col-sm-12 dv-input-container-small form-group"
                        >
                            <label
                                class="md-no-float required"
                                data-translate="EINTRITTSDATUM"
                                for="eintrittsdatum_ID"
                            ></label>
                            <dv-date-picker-angularjs-xx
                                inputId="eintrittsdatum_ID"
                                name="eintrittsdatum"
                                [(date)]="
                                    vm.getBetreuung().belegungTagesschule
                                        .eintrittsdatum
                                "
                                [required]="true"
                                date-picker-enabled="false"
                                class="input-element"
                                disabled="true"
                            >
                            </dv-date-picker-angularjs-xx>
                        </div>
                    </div>

                    <!-- Planklasse -->
                    <div class="row">
                        <div class="col-sm-12 dv-input-container-small">
                            <dv-input-container class="form-group">
                                <label class="md-no-float" for="planKlasse_ID">
                                    <span data-translate="PLANKLASSE"> </span>
                                    <dv-tooltip
                                        input-id="planKlasse"
                                        text="'PLANKLASSE_INFO' | translate"
                                    ></dv-tooltip>
                                </label>
                                <input
                                    aria-describedby="planKlasse_ID-error"
                                    id="planKlasse_ID"
                                    type="text"
                                    name="planKlasse"
                                    ng-model="vm.getBetreuung().belegungTagesschule.planKlasse"
                                    dv-max-length
                                    class="form-control"
                                    ng-disabled="true"
                                />
                            </dv-input-container>
                        </div>
                    </div>

                    <!-- Abholung aus der Tagesschule -->
                    <div class="row margin-top-20">
                        <div class="col-sm-12 dv-input-container-medium">
                            <div class="form-group">
                                <label
                                    class="md-no-float"
                                    ng-class="{
                                        required: vm.isGesuchstellerRole()
                                    }"
                                    for="abholungTagesschule_ID"
                                >
                                    <span
                                        data-translate="ABHOLUNG_AUS_TAGESSCHULE"
                                    ></span>
                                </label>
                                <div class="dv-select-style">
                                    <select
                                        aria-describedby="abholungTagesschule_ID-error"
                                        name="abholungTagesschule"
                                        id="abholungTagesschule_ID"
                                        ng-model="vm.getBetreuung().belegungTagesschule.abholungTagesschule"
                                        ng-options="(abholungTagesschule| translate) for abholungTagesschule in vm.getAbholungTagesschuleValues()"
                                        class="form-control"
                                        ng-disabled="true"
                                    ></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TS-Module -->
                    <div class="dv-ebegu-calendar-wrapper-tagesschule">
                        <!-- Header mit Wochentagen -->
                        <div class="dv-ebegu-calendar-row--tagesschule">
                            <div
                                class="dv-ebegu-calendar-wrapper-small-blank"
                            ></div>
                            <div class="dv-ebegu-calendar-wrapper">
                                <div
                                    class="dv-ebegu-calendar-container-weekdays"
                                >
                                    <div
                                        class="dv-ebegu-calendar-weekday dv-ebegu-calendar-weekday--{{
                                            day
                                        }}"
                                        ng-repeat="day in vm.getWeekDays()"
                                    >
                                        {{ day | translate }}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div
                            class="dv-ebegu-calendar-row--tagesschule"
                            ng-repeat="group in vm.modulGroups track by group.group.identifier"
                        >
                            <!-- Gruppe (Name und Zeit) -->
                            <div
                                class="dv-ebegu-calendar-wrapper-small dv-ebegu-calendar-module"
                            >
                                <span
                                    class="dv-ebegu-calendar-module-name"
                                    ng-bind="vm.getModulBezeichnungInLanguage(group.group)"
                                ></span>
                                <span
                                    class="dv-ebegu-calendar-module-time"
                                    ng-bind="vm.getModulTimeAsString(group.group)"
                                ></span>
                            </div>
                            <div class="dv-ebegu-calendar-wrapper">
                                <div
                                    class="dv-ebegu-calendar-container dv-ebegu-calendar-container--no-margin"
                                >
                                    <div
                                        class="dv-ebegu-calendar-day dv-ebegu-calendar-day--1"
                                        ng-repeat="mod in group.module track by mod.modulTagesschule.identifier"
                                    >
                                        <md-checkbox
                                            name="modul_{{
                                                mod.modulTagesschule.identifier
                                            }}"
                                            ng-model="mod.modulTagesschule.angemeldet"
                                            aria-label="Modul {{
                                                group.group.bezeichnung
                                            }} {{
                                                mod.modulTagesschule.wochentag
                                                    | translate
                                            }}"
                                            ng-disabled="!vm.isModuleEditable(mod)"
                                            ng-change="vm.openMenu(mod, group, $mdMenu, $event)"
                                            class="dv-ebegu-calendar--tagesschule"
                                        >
                                            <span
                                                ng-if="
                                                    mod.modulTagesschule
                                                        .angemeldet
                                                "
                                                >{{
                                                    mod.intervall | translate
                                                }}</span
                                            >
                                        </md-checkbox>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Abweichung zweites Semester und Bemerkungen -->
                    <div class="row margin-top-30">
                        <div class="col-sm-12 dv-input-container-question">
                            <md-checkbox
                                class="checkbox margin-top-20"
                                ng-model="vm.getBetreuung().belegungTagesschule.abweichungZweitesSemester"
                                name="abweichungZweitesSemester"
                                id="abweichungZweitesSemester"
                                aria-label="{{
                                    'BETREUUNG_TAGESSCHULE_BEMERKUNG_CHECKBOX'
                                        | translate
                                }}"
                                ng-disabled="true"
                            >
                                <span
                                    data-translate="BETREUUNG_TAGESSCHULE_BEMERKUNG_CHECKBOX"
                                ></span>
                            </md-checkbox>
                            <dv-input-container
                                class="form-group"
                                ng-show="
                                    vm.getBetreuung().belegungTagesschule
                                        .abweichungZweitesSemester
                                "
                            >
                                <label
                                    class="md-no-float"
                                    ng-class="{
                                        required:
                                            vm.getBetreuung()
                                                .belegungTagesschule
                                                .abweichungZweitesSemester
                                    }"
                                    data-translate="BETREUUNG_TAGESSCHULE_BEMERKUNG"
                                    for="bemerkung_ID"
                                >
                                </label>
                                <p
                                    class="inline-hint"
                                    data-translate="BETREUUNG_TAGESSCHULE_BEMERKUNG_HINT"
                                ></p>
                                <textarea
                                    aria-describedby="bemerkung_ID-error"
                                    name="bemerkung"
                                    class="form-control"
                                    rows="6"
                                    id="bemerkung_ID"
                                    ng-model="vm.getBetreuung().belegungTagesschule.bemerkung"
                                    ng-required="vm.getBetreuung().belegungTagesschule.abweichungZweitesSemester"
                                    maxlength="4000"
                                    ng-disabled="true"
                                >
                                </textarea>
                            </dv-input-container>
                        </div>
                    </div>
                    <!-- Bei Tagis Tagesschule sind die Tarif und PDF nicht angezeigt-->
                    <ng-container
                        ng-if="!vm.isTagesschuleTagi() && vm.showTarifeTable()"
                    >
                        <!-- Info bei noch provisorischem Tarif -->
                        <div
                            class="row"
                            ng-if="
                                vm.getBetreuung().betreuungsstatus !==
                                'SCHULAMT_ANMELDUNG_UEBERNOMMEN'
                            "
                        >
                            <div class="col-md-12">
                                <h3
                                    class="md-no-float"
                                    data-test="verfuegung-tagesschule-provisorisch"
                                    data-translate="TAGESSCHULE_PROVISORISCHE_BERECHNUNG_TITEL"
                                ></h3>
                                <p
                                    class="inline-hint"
                                    data-translate="TAGESSCHULE_PROVISORISCHE_BERECHNUNG_INFOTEXT"
                                ></p>
                            </div>
                        </div>

                        <!-- Preview oder definitive Verfuegung -->
                        <div
                            class="row"
                            ng-if="
                                vm.tagesschuleZeitabschnitteMitBetreuung
                                    .length > 0
                            "
                            data-test="tagesschul-anmeldung-tarife"
                        >
                            <br />
                            <div class="col-md-12 table-responsive">
                                <h3
                                    class="md-no-float"
                                    data-translate="TAGESSCHULE_GEBUEHREN_BETREUT"
                                ></h3>

                                <table
                                    st-table="tsTagesschuleMitBetreuungList"
                                    st-safe-src="vm.tagesschuleZeitabschnitteMitBetreuung"
                                    class="table verfuegung-table"
                                >
                                    <thead>
                                        <tr class="title-row">
                                            <th
                                                data-translate="BETREUUNG_VON"
                                                class="bis-spacing"
                                            ></th>
                                            <th
                                                data-translate="BETREUUNG_BIS"
                                                class="bis-spacing"
                                            ></th>
                                            <th
                                                data-translate="BETREUUNGSTUNDEN_PRO_WOCHE"
                                            ></th>
                                            <th
                                                data-translate="GEBUHR_PRO_STUNDE"
                                            ></th>
                                            <th
                                                data-translate="VERPFLEGUNGSKOSTEN_PRO_WOCHE"
                                            ></th>
                                            <th
                                                ng-if="
                                                    vm.isMahlzeitenverguenstigungEnabled()
                                                "
                                                data-translate="VERGUENSTIGUNG_VERPFLEGUNG_PRO_WOCHE"
                                            ></th>
                                            <th
                                                class="result"
                                                data-translate="TOTAL_KOSTEN_PRO_WOCHE"
                                            ></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr
                                            ng-repeat="zeitabschnitt in tsTagesschuleMitBetreuungList"
                                            ng-attr-data-test="{{
                                                'tagesschul-anmeldung-zeitabschnitt#' +
                                                    $index
                                            }}"
                                        >
                                            <!-- Von -->
                                            <td
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigAb | amDateFormat : 'DD.MM.YYYY'"
                                                data-test="tagesschul-anmeldung-zeitabschnitt-gueltig-ab"
                                                class="bis-spacing"
                                            ></td>
                                            <!-- Bis -->
                                            <td
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigBis | amDateFormat : 'DD.MM.YYYY'"
                                                data-test="tagesschul-anmeldung-zeitabschnitt-gueltigb-bis"
                                                class="bis-spacing"
                                            ></td>
                                            <!-- Betreungszeit Pro Woche -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.betreuungszeitProWocheFormatted"
                                                ></span>
                                            </td>
                                            <!-- Gebühren Pro Stunde -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.gebuehrProStunde | currency : '' : 2"
                                                    data-test="tagesschul-anmeldung-zeitabschnitt-tarif"
                                                ></span>
                                            </td>
                                            <!-- Verpflegungskosten Pro Woche -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.verpflegungskosten | currency : '' : 2"
                                                ></span>
                                            </td>
                                            <!-- Mahlzeitenvergünstigung -->
                                            <td
                                                ng-if="
                                                    vm.isMahlzeitenverguenstigungEnabled()
                                                "
                                            >
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.verpflegungskostenVerguenstigt | currency : '' : 2"
                                                ></span>
                                            </td>
                                            <!-- Total Kosten Pro Woche -->
                                            <td class="result">
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.totalKostenProWoche | currency : '' : 2"
                                                ></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div
                            class="row"
                            ng-if="
                                vm.tagesschuleZeitabschnitteOhneBetreuung
                                    .length > 0
                            "
                        >
                            <br />
                            <div class="col-md-12 table-responsive">
                                <h3
                                    class="md-no-float"
                                    data-translate="TAGESSCHULE_GEBUEHREN_NICHT_BETREUT"
                                ></h3>

                                <table
                                    st-table="tsTagesschuleOhneBetreuungList"
                                    st-safe-src="vm.tagesschuleZeitabschnitteOhneBetreuung"
                                    class="table verfuegung-table"
                                >
                                    <thead>
                                        <tr class="title-row">
                                            <th
                                                data-translate="BETREUUNG_VON"
                                            ></th>
                                            <th
                                                data-translate="BETREUUNG_BIS"
                                            ></th>
                                            <th
                                                data-translate="BETREUUNGSTUNDEN_PRO_WOCHE"
                                            ></th>
                                            <th
                                                data-translate="GEBUHR_PRO_STUNDE"
                                            ></th>
                                            <th
                                                data-translate="VERPFLEGUNGSKOSTEN_PRO_WOCHE"
                                            ></th>
                                            <th
                                                ng-if="
                                                    vm.isMahlzeitenverguenstigungEnabled()
                                                "
                                                data-translate="VERGUENSTIGUNG_VERPFLEGUNG_PRO_WOCHE"
                                            ></th>
                                            <th
                                                class="result"
                                                data-translate="TOTAL_KOSTEN_PRO_WOCHE"
                                            ></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr
                                            ng-repeat="zeitabschnitt in tsTagesschuleOhneBetreuungList"
                                        >
                                            <!-- Von -->
                                            <td
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigAb | amDateFormat : 'DD.MM.YYYY'"
                                            ></td>
                                            <!-- Bis -->
                                            <td
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigBis | amDateFormat : 'DD.MM.YYYY'"
                                            ></td>
                                            <!-- Betreungszeit Pro Woche -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultOhnePaedagogischerBetreuung.betreuungszeitProWocheFormatted"
                                                ></span>
                                            </td>
                                            <!-- Gebühren Pro Stunde -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultOhnePaedagogischerBetreuung.gebuehrProStunde"
                                                ></span>
                                            </td>
                                            <!-- Verpflegungskosten Pro Woche -->
                                            <td>
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultOhnePaedagogischerBetreuung.verpflegungskosten"
                                                ></span>
                                            </td>
                                            <!-- Mahlzeitenvergünstigung -->
                                            <td
                                                ng-if="
                                                    vm.isMahlzeitenverguenstigungEnabled()
                                                "
                                            >
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultOhnePaedagogischerBetreuung.verpflegungskostenVerguenstigt"
                                                ></span>
                                            </td>
                                            <!-- Total Kosten Pro Woche -->
                                            <td class="result">
                                                <span
                                                    ng-bind="zeitabschnitt.tsCalculationResultOhnePaedagogischerBetreuung.totalKostenProWoche"
                                                ></span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div
                            class="row margin-top-20"
                            ng-if="vm.showVorgaengerGebuehren()"
                        >
                            <div class="col-xs-12">
                                <h3>
                                    <span
                                        data-translate="TAGESSCHULE_GEBUEHR_VOR_MUTATION"
                                    >
                                    </span>
                                    <dv-tooltip
                                        input-id="planKlasse"
                                        text="'TAGESSCHULE_GEBUEHR_VOR_MUTATION_HELP' | translate"
                                    ></dv-tooltip>
                                </h3>
                                <ul>
                                    <li
                                        ng-repeat="zeitabschnitt in vm.vorgaengerZeitabschnitteSchulamt"
                                    >
                                        <p>
                                            <span
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigAb | amDateFormat : 'DD.MM.YYYY'"
                                            ></span>
                                            <span>&nbsp;-&nbsp;</span>
                                            <span
                                                ng-bind="zeitabschnitt.gueltigkeit.gueltigBis | amDateFormat : 'DD.MM.YYYY'"
                                            ></span>
                                            <span>:&nbsp;CHF </span>
                                            <span
                                                ng-bind="zeitabschnitt.tsCalculationResultMitPaedagogischerBetreuung.gebuehrProStunde  | currency : '' : 2"
                                            ></span>
                                        </p>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <!--VerfuegungPDF anzeigen-->
                        <div class="row margin-top-20 text-left">
                            <div
                                class="col-xs-12"
                                ng-if="
                                    vm.showAnmeldebestaetigungOhneTarifPdfLink()
                                "
                            >
                                <button
                                    type="button"
                                    class="dv-btn btn-link link-underline"
                                    ng-click="vm.openAnmeldebestaetigungOhneTarifPDF()"
                                >
                                    <i class="fa fa-file-text-o"></i>
                                    <span
                                        data-translate="PDF_ANMELDEBESTAETIGUNG_OHNE_TARIF_ANZEIGEN"
                                    ></span>
                                </button>
                            </div>
                            <div
                                class="col-xs-12"
                                ng-if="
                                    vm.showAnmeldebestaetigungMitTarifPdfLink()
                                "
                            >
                                <button
                                    type="button"
                                    class="dv-btn btn-link link-underline"
                                    ng-click="vm.openAnmeldebestaetigungMitTarifPDF()"
                                >
                                    <i class="fa fa-file-text-o"></i>
                                    <span
                                        data-translate="PDF_ANMELDEBESTAETIGUNG_MIT_TARIF_ANZEIGEN"
                                    ></span>
                                </button>
                            </div>
                        </div>
                    </ng-container>
                </div>

                <!-- Tabelle -->
                <div
                    class="row"
                    ng-if="
                        vm.showVerfuegungsDetails() &&
                        !vm.isTagesschuleVerfuegung() &&
                        !vm.hasBetreuungOnlyAuszahlungenAnElternAndInstitutionRole()
                    "
                >
                    <div class="col-md-12 table-responsive">
                        <table
                            st-table="displayedCollection"
                            st-safe-src="vm.getVerfuegungZeitabschnitte()"
                            class="table verfuegung-table"
                        >
                            <thead>
                                <tr class="infotext-row">
                                    <td></td>
                                    <td></td>
                                    <td ng-if="vm.showPercent">
                                        <dv-tooltip
                                            text="'EFFEKTIVE_BETREUUNG_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showHours">
                                        <dv-tooltip
                                            text="'EFFEKTIVE_BETREUUNG_IN_H_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showDays">
                                        <dv-tooltip
                                            text="'EFFEKTIVE_BETREUUNG_IN_D_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showPercent">
                                        <dv-tooltip
                                            text="'ANSPRUCH_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showHours">
                                        <dv-tooltip
                                            text="'ANSPRUCH_IN_H_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showDays">
                                        <dv-tooltip
                                            text="'ANSPRUCH_IN_D_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showPercent">
                                        <dv-tooltip
                                            text="'VERGUENSTIGT_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showHours">
                                        <dv-tooltip
                                            text="'VERGUENSTIGT_IN_H_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td ng-if="vm.showDays">
                                        <dv-tooltip
                                            text="'VERGUENSTIGT_IN_D_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td>
                                        <dv-tooltip
                                            text="'VOLLKOSTEN_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td
                                        ng-if="vm.showSelbstbehaltProzent()"
                                        class="result"
                                    >
                                        <dv-tooltip
                                            text="'SELBSTBEHALT_PROZENT_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td
                                        ng-if="vm.showBeitragshoheProzent()"
                                        class="result"
                                    >
                                        <dv-tooltip
                                            text="'BEITRAGSHOHE_PROZENT_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td
                                        ng-if="
                                            vm.isLineareZusaetzlicherGutscheinDurchGemeindeEnabled()
                                        "
                                    >
                                        &nbsp;
                                    </td>
                                    <td
                                        ng-if="
                                            vm.showGutscheinOhneBeruecksichtigungVollkosten()
                                        "
                                    >
                                        <dv-tooltip
                                            text="'GUTSCHEIN_OHNE_BERUECKSICHTIGUNG_VOLLKOSTEN_HELP' | translate"
                                        ></dv-tooltip>
                                    </td>
                                    <td
                                        ng-if="
                                            vm.showElternMinimalerBeitragColumns()
                                        "

                            class="ie11-fix"
                            ng-show="
                                (!vm.sameVerfuegteVerfuegungsrelevanteDaten ||
                                    vm.mahlzeitenChanged) &&
                                vm.showVerfuegung &&
                                !vm.gesuchModelManager.isGesuch()
                            "
                        >
                            <!--Mutation wird nicht akzeptiert -> schliessen ohne Verfuegung. Der Status ist passt meiner Meinung
                            nach nicht 100% aber im Moment passt der am besten. (siehe auch EBEGU-890) -->
                            <dv-loading-button
                                input-id="buttonAblehnen"
                                type="submit"
                                button-click="vm.schliessenOhneVerfuegen()"
                                ng-if="!vm.disableAblehnen()"
                                data-test="container.ablehnen"
                            >
                                <span
                                    class="uppercase"
                                    data-translate="VERFUEGEN_ABLEHNEN"
                                ></span>
                            </dv-loading-button>
                        </span>
                        <span
                            class="ie11-fix"
                            ng-show="
                                vm.showVerfuegung &&
                                vm.sameVerfuegteVerfuegungsrelevanteDaten &&
                                !vm.mahlzeitenChanged
                            "
                        >
                            <dv-loading-button
                                input-id="buttonVerzichten"
                                type="submit"
                                button-click="vm.schliessenOhneVerfuegen()"
                                data-test="container.verfuegen-verzichten"
                            >
                                <span
                                    class="uppercase"
                                    data-translate="VERFUEGEN_VERZICHTEN"
                                ></span>
                            </dv-loading-button>
                        </span>
                        <span
                            class="ie11-fix"
                            ng-show="
                                vm.showVerfuegung &&
                                vm.sameVerfuegteVerfuegungsrelevanteDaten &&
                                !vm.mahlzeitenChanged
                            "
                        >
                            <dv-loading-button
                                input-id="buttonTrotzdemVerfuegen"
                                type="submit"
                                button-click="vm.save()"
                                data-test="container.trotzdem-verfuegen"
                            >
                                <span
                                    class="uppercase"
                                    data-translate="TROTZDEM_VERFUEGEN"
                                ></span>
                            </dv-loading-button>
                        </span>
                    </span>
                    <span>
                        <dv-navigation
                            container-class="avoid"
                            dv-cancel="vm.cancel()"
                            dv-next="false"
                            dv-sub-step="2"
                            data-test="container.cancel"
                        >
                        </dv-navigation>
                    </span>
                </div>
            </form>
        </div>
    </div>
</div>
