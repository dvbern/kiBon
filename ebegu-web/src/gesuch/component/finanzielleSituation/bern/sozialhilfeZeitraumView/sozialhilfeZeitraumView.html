<div class="sozialhilfeZeitraumView gesuch-modul static-position">
    <h1 class="access-for-all-title" data-translate="AFA_GESUCHSFORMULAR"></h1>
    <div class="row view-title">
        <div class="col-md-12">
            <h2>
                <span data-translate="SOZIALHILFEZEITRAUM_TITLE"></span>
            </h2>
            <dv-bisher
                gs="vm.model.sozialhilfeZeitraumGS"
                ja="vm.model.sozialhilfeZeitraumJA"
                specific-bisher-text="'DURCH_GEMEINDE_ERFASST' | translate"
                show-specific-bisher-text-if-bisher-none="true"
            ></dv-bisher>

            <hr class="header" />
            <p
                class="inline-hint"
                data-translate="PFLICHTFELDER_HINT"
                ng-if="!vm.isLuzern"
            ></p>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <form
                role="form"
                name="vm.form"
                class=""
                novalidate
                unsaved-warning-form
                ng-if="vm.model"
            >
                <fieldset ng-disabled="vm.isGesuchReadonly()">
                    <!--Ab Wann / Bis-->
                    <div class="row">
                        <div class="col-sm-12 dv-input-container-small">
                            <dv-input-container class="form-group">
                                <label
                                    class="md-no-float required"
                                    data-translate="AB"
                                    for="sozialhilfeZeitraumAbID"
                                >
                                </label>
                                <dv-date-picker-angularjs-xx
                                    inputId="sozialhilfeZeitraumAbID"
                                    name="sozialhilfeZeitraumAb"
                                    [(date)]="
                                        vm.model.sozialhilfeZeitraumJA
                                            .gueltigkeit.gueltigAb
                                    "
                                    ng-model="vm.model.sozialhilfeZeitraumJA
                                            .gueltigkeit.gueltigAb"
                                    required
                                    class="input-element"
                                    [disabled]="
                                        vm.sozialhilfeZeitraumDisabled() ||
                                        vm.isGesuchReadonly()
                                    "
                                >
                                </dv-date-picker-angularjs-xx>
                                <dv-bisher
                                    gs="vm.model.sozialhilfeZeitraumGS.gueltigkeit.gueltigAb"
                                    ja="vm.model.sozialhilfeZeitraumJA.gueltigkeit.gueltigAb"
                                    show-if-bisher-none="vm.isNotNullOrUndefined(vm.model.sozialhilfeZeitraumGS)"
                                ></dv-bisher>
                                <dv-error-messages
                                    input-id="sozialhilfeZeitraumAbID"
                                    for="vm.dateError()"
                                    class="error"
                                ></dv-error-messages>
                            </dv-input-container>
                        </div>
                        <div class="col-sm-12 dv-input-container-small">
                            <dv-input-container class="form-group">
                                <label
                                    class="md-no-float"
                                    data-translate="BIS"
                                    for="sozialhilfeZeitraumBisID"
                                >
                                </label>
                                <dv-date-picker-angularjs-xx
                                    inputId="sozialhilfeZeitraumBisID"
                                    name="sozialhilfeZeitraumBis"
                                    [(date)]="
                                        vm.model.sozialhilfeZeitraumJA
                                            .gueltigkeit.gueltigBis
                                    "
                                    [required]="false"
                                    class="input-element"
                                    [disabled]="vm.isGesuchReadonly()"
                                >
                                </dv-date-picker-angularjs-xx>
                                <dv-bisher
                                    gs="vm.model.sozialhilfeZeitraumGS.gueltigkeit.gueltigBis"
                                    ja="vm.model.sozialhilfeZeitraumJA.gueltigkeit.gueltigBis"
                                    show-if-bisher-none="vm.isNotNullOrUndefined(vm.model.sozialhilfeZeitraumGS)"
                                ></dv-bisher>
                                <dv-error-messages
                                    input-id="sozialhilfeZeitraumBisID"
                                    for="vm.form.sozialhilfeZeitraumBis.$error"
                                    class="error"
                                ></dv-error-messages>
                            </dv-input-container>
                        </div>
                    </div>
                </fieldset>

                <!--Buttons-->
                <dv-navigation
                    dv-cancel="vm.cancel()"
                    dv-save="vm.save()"
                    can-go-next="!vm.isGesuchReadonly()"
                    dv-sub-step="2"
                    dv-sub-step-name="BERN_SOZIALHILFE_DETAIL"
                    dv-translate-next="{{ 'SPEICHERN' }}"
                >
                </dv-navigation>
            </form>

            <p
                ng-if="!vm.model"
                data-translate="NO_SOZIALHILFEZEITRAUM_DATA"
            ></p>
        </div>
    </div>
</div>
