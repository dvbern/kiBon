<div class="dv-date-picker-x">
    <dv-input-container-x class="form-group">
        @if (label) {
            <label
                class="md-no-float"
                [ngClass]="{required: required}"
                [for]="(inputId ? inputId : 'date-') + randId"
                >{{ label | translate }}
                @if (tooltip) {
                    <dv-tooltip [text]="tooltip | translate"></dv-tooltip>
                }
            </label>
        }
        <input
            [ngClass]="{
                'dv-mat-datepicker': datePickerEnabled,
                'dv-mat-datepicker-wide': !datePickerEnabled
            }"
            type="text"
            [name]="(inputId ? inputId : 'date-' + randId) + '-name'"
            [id]="(inputId ? inputId : 'date-') + randId"
            #dateRef="ngModel"
            [(ngModel)]="date"
            [noFutureDate]="noFutureDate"
            (dateChange)="emit()"
            [min]="minDate"
            [max]="maxDate"
            [matDatepicker]="datePicker"
            placeholder="{{
                placeholderFirstOfMonth
                    ? ('DATE_PLACEHOLDER_FIRSTOFMONTH' | translate)
                    : ('DATE_PLACEHOLDER' | translate)
            }}"
            [required]="required"
            [disabled]="disabled"
        />
        @if (datePickerEnabled) {
            <mat-datepicker-toggle
                matSuffix
                [for]="datePicker"
            ></mat-datepicker-toggle>
        }
        <mat-datepicker #datePicker></mat-datepicker>
        @if (dateRef.touched) {
            <dv-error-messages
                [errorObject]="dateRef.errors"
                class="error"
            ></dv-error-messages>
        }
    </dv-input-container-x>
</div>
