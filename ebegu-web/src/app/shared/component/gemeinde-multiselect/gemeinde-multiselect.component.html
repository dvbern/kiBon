@if (allowedMap$ | async; as allowedGemeinden) {
    <div [ngClass]="{'form-group': true, 'ie-workaround': isIE()}">
        @if (showLabel) {
            <label [for]="inputId" translate>GEMEINDEN</label>
        }
        <mat-select
            class="form-control"
            [ngModel]="selected"
            [name]="inputId"
            [disabled]="disabled"
            [id]="inputId"
            [required]="required"
            [multiple]="true"
        >
            @for (item of allowedGemeinden | keyvalue; track item) {
                <mat-option
                    (onSelectionChange)="onSelectionChange($event)"
                    [value]="item.key"
                >
                    {{ item.key.name }}
                </mat-option>
            }
        </mat-select>
        <dv-error-messages
            [inputId]="inputId"
            [errorObject]="form.controls[inputId]?.errors"
        >
        </dv-error-messages>
    </div>
}
