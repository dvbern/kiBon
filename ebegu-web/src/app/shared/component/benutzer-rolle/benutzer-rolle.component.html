<label translate [for]="inputId">ROLLE</label>
<div class="dv-select-style">
    <!--suppress HtmlFormInputWithoutLabel -->
    <select
        [attr.aria-describedby]="inputId + '-error'"
        class="form-control"
        [id]="inputId"
        [name]="name"
        [required]="required"
        [disabled]="disabled"
        [(ngModel)]="benutzerRolle"
    >
        @for (item of roles | keyvalue; track trackByRole($index, item)) {
            <option [ngValue]="item.key">
                {{ item.value | translate }}
            </option>
        }
    </select>
    <dv-error-messages
        [inputId]="inputId"
        [errorObject]="form.controls[name]?.errors"
    ></dv-error-messages>
</div>
