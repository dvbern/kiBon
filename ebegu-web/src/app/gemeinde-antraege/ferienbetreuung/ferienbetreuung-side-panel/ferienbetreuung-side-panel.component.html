<div
    class="kommentar-view flex flex-col h-full bg-white max-w-[45rem] p-6 w-full"
>
    @if (ferienbetreuungContainer) {
        <form role="form" [formGroup]="form" class="" layout="column">
            <div class="kommentarTop">
                <div class="form-group kommentar-feld">
                    <label class="md-no-float" for="kommmentar" translate
                        >BEMERKUNGEN_INTERN</label
                    >
                    <textarea
                        class="form-control"
                        rows="10"
                        id="kommmentar"
                        maxlength="4000"
                        [formControl]="form.controls.kommentar"
                        (blur)="saveKommentar()"
                    ></textarea>
                    <dv-saving-info [saving$]="saving$"></dv-saving-info>
                </div>
            </div>
            <button
                uiSref="FERIENBETREUUNG.VERLAUF"
                type="button"
                class="dv-btn bg-[#68acfc] hover:bg-[#68acfc] w-full mt-12"
            >
                <span translate>VERLAUF_ANZEIGEN</span>
            </button>
            <div class="verantwortlicher-view mt-12">
                <div class="form-group pt-0">
                    <mat-select
                        [(ngModel)]="
                            getFerienbetreuungContainer().verantwortlicher
                        "
                        id="verantwortlicher"
                        class="form-control"
                        (selectionChange)="saveVerantwortlicher()"
                        [ngModelOptions]="{standalone: true}"
                        placeholder=" {{
                            'VERANTWORTLICHER'
                                | translate
                                    : {name: getVerantwortlicherFullName()}
                        }}"
                    >
                        <mat-option [value]="undefined">
                            {{
                                'NO_VERANTWORTLICHER_SELECTED' | translate
                            }}</mat-option
                        >
                        @for (benutzer of userList; track benutzer) {
                            <mat-option [value]="benutzer">
                                {{
                                    'VERANTWORTLICHER'
                                        | translate
                                            : {name: benutzer.getFullName()}
                                }}</mat-option
                            >
                        }
                    </mat-select>
                </div>
            </div>
        </form>
    }
</div>
