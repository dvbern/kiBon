<div
    class="tw:flex tw:justify-center tw:items-end tw:gap-4 margin-bottom-20 tw:wrap"
>
    <input
        class="tw:outline! tw:min-w-32.5"
        matInput
        type="text"
        [(ngModel)]="subjectOrReceiver"
        placeholder="{{ 'VERSENDETE_MAILS_SUCHE_PLATZHALTER' | translate }}"
        data-test="SearchBarSentMails"
    />

    <kib-admin-date-range-filter
        [(dateRange)]="dateRange"
    ></kib-admin-date-range-filter>
</div>
