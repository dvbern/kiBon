<div
    class="tw:flex tw:justify-center tw:items-end tw:gap-4 margin-bottom-20 tw:wrap"
>
    <input
        class="tw:outline! tw:outline-[2px]! tw:min-w-[130px]"
        matInput
        type="text"
        [(ngModel)]="nameOrResult"
        placeholder="{{ 'BATCHJOB_HISTORY_SUCHE_PLATZHALTER' | translate }}"
        data-test="SearchBarBatchjobHistory"
    />

    <mat-form-field floatLabel="always" class="tw:min-w-[180px]!">
        <mat-label><span translate>STATUS_BATCHJOB_HISTORY</span></mat-label>
        <mat-select
            multiple
            [(ngModel)]="status"
            [placeholder]="'ALLE' | translate"
            data-test="StatusFilterBatchjobHistory"
        >
            @for (option of STATUSES; track option) {
                <mat-option [value]="option">{{
                    'BATCHJOB_STATUS_' + option | translate
                }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <kib-admin-date-range-filter
        [fromLabel]="'BATCHJOB_HISTORY_STARTZEIT_VON'"
        [toLabel]="'BATCHJOB_HISTORY_STARTZEIT_BIS'"
        [(dateRange)]="dateRange"
    ></kib-admin-date-range-filter>
</div>
