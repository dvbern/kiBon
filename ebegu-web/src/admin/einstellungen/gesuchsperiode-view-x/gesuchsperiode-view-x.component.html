<div flex="auto" class="gesuchsperiode-view admin-modul overflow-auto">
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <form
                name="form"
                [ngClass]="{'ng-submitted': form.submitted}"
                #form="ngForm"
                role="form"
                novalidate
            >
                <fieldset [disabled]="isReadonly()">
                    <!-- Gesuchsperiode Detail -->
                    @if (gesuchsperiode) {
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <div class="row">
                                    <div class="col-md-4">
                                        <label
                                            class="md-no-float"
                                            translate="GESUCHSPERIODE_GUELTIG_AB"
                                            for="gueltigAb_ID"
                                        ></label>
                                    </div>
                                    <div class="col-md-8">
                                        <input
                                            type="text"
                                            name="gueltigAb"
                                            id="gueltigAb_ID"
                                            [value]="
                                                gesuchsperiode.gueltigkeit.gueltigAb?.toDate()
                                                    | date: 'dd.MM.yyyy'
                                            "
                                            disabled
                                            required
                                        />
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 form-group">
                                <div class="row">
                                    <div class="col-md-4">
                                        <label
                                            class="md-no-float"
                                            translate="GESUCHSPERIODE_GUELTIG_BIS"
                                            for="gueltigBis_ID"
                                        ></label>
                                    </div>
                                    <div class="col-md-8">
                                        <input
                                            type="text"
                                            name="gueltigBis"
                                            id="gueltigBis_ID"
                                            [value]="
                                                gesuchsperiode.gueltigkeit.gueltigBis?.toDate()
                                                    | date: 'dd.MM.yyyy'
                                            "
                                            disabled
                                            required
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <div class="row">
                                    <div class="col-md-4">
                                        <label
                                            translate="STATUS"
                                            for="gpstatus"
                                        >
                                        </label>
                                    </div>
                                    <div class="col-md-8 dv-select-style">
                                        <select
                                            name="gpstatus"
                                            id="gpstatus"
                                            [(ngModel)]="gesuchsperiode.status"
                                            class="form-control"
                                            [disabled]="gesuchsperiode.isNew()"
                                            required
                                        >
                                            @for (
                                                gpstatus of getTSGesuchsperiodeStatusValues();
                                                track gpstatus
                                            ) {
                                                <option [ngValue]="gpstatus">
                                                    {{ gpstatus | translate }}
                                                </option>
                                            }
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-8 col-md-offset-4">
                                        <dv-error-messages
                                            for="form.gpstatus.$error"
                                        ></dv-error-messages>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Gesuchsperiode Buttons -->
                        @if (!isReadonly()) {
                            <div class="row">
                                <div class="col-md-2">
                                    <dv-loading-button
                                        type="button"
                                        (buttonClick)="saveGesuchsperiode()"
                                        buttonClass="color-success"
                                    >
                                        <span>{{
                                            gesuchsperiode.isNew()
                                                ? ('SAVE' | translate)
                                                : ('UPDATE' | translate)
                                        }}</span>
                                    </dv-loading-button>
                                </div>
                                <div class="col-md-2">
                                    <a
                                        href="#"
                                        id="cancelLink"
                                        class="dv-btn"
                                        unsaved-warning-clear
                                        (click)="
                                            cancelGesuchsperiode();
                                            form.form.markAsPristine();
                                            form.form.markAsUntouched();
                                            $event.preventDefault()
                                        "
                                    >
                                        <span translate="CANCEL"></span>
                                    </a>
                                </div>
                            </div>
                        }

                        @if (!gesuchsperiode.isNew()) {
                            <!--Erläuterungen zur Verfügung-->
                            <div class="row view-title margin-top-30">
                                <div class="col-md-12">
                                    <h1>
                                        <span
                                            translate="ERLAEUTERUNG_VERFUEGUNG"
                                        ></span>
                                    </h1>
                                    <hr class="header" />
                                    <table
                                        class="table table-striped"
                                        width="100%"
                                    >
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <dv-single-file-upload
                                                        [title]="
                                                            'ERLAEUTERUNG_VERFUEGUNG_DE'
                                                        "
                                                        (download)="
                                                            downloadGesuchsperiodeDokument(
                                                                DEUTSCH,
                                                                ERLAUTERUNG_ZUR_VERFUEGUNG
                                                            )
                                                        "
                                                        (delete)="
                                                            removeGesuchsperiodeDokument(
                                                                DEUTSCH,
                                                                ERLAUTERUNG_ZUR_VERFUEGUNG
                                                            )
                                                        "
                                                        (uploadFile)="
                                                            uploadGesuchsperiodeDokument(
                                                                $event,
                                                                DEUTSCH,
                                                                ERLAUTERUNG_ZUR_VERFUEGUNG,
                                                                TSDokumentUploadTyp.PDF
                                                            )
                                                        "
                                                        [allowedMimetypes]="
                                                            'application/pdf'
                                                        "
                                                        [hasFile]="
                                                            isErlaeuterungDE
                                                        "
                                                    >
                                                    </dv-single-file-upload>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <dv-single-file-upload
                                                        [title]="
                                                            'ERLAEUTERUNG_VERFUEGUNG_FR'
                                                        "
                                                        (download)="
                                                            downloadGesuchsperiodeDokument(
                                                                FRANZOESISCH,
                                                                ERLAUTERUNG_ZUR_VERFUEGUNG
                                                            )
                                                        "
                                                        (delete)="

                                                                FRANZOESISCH,
                                                                ERLAUTERUNG_ZUR_VERFUEGUNG
                                                            )
                                                        "
                                                        (uploadFile)="

                                    </table>
                                </div>
                            </div>

                                                        "

                                                        "
                                                    >
                                                    </dv-single-file-upload>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>

                                                        "

                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <!--Vorlage Verfügung Lastenausgleich Tagesschulen -->

                                    </h1>
                                    <hr class="header" />
                                    <table

                                        <tbody>

                                                <td>

                                                        "
                                                    >

                                            </tr>
                                            <tr>

                                        ></span>
                                    </h1>
                                    <hr class="header" />

                                                    <dv-single-file-upload
                                                        [title]="
                                                            'VORLAGE_VERFUEGUNG_FERIENBETREUUNG_DE'
                                                        "
                                                        (download)="
                                                            downloadGesuchsperiodeDokument(
                                                                DEUTSCH,

                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <lib-admin-gesuchsperioden-einstellungen
                                [gesuchsperiode]="gesuchsperiode"
                            ></lib-admin-gesuchsperioden-einstellungen>
                        }
                    }
                </fieldset>
            </form>
        </div>
    </div>
</div>
