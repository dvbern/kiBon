MsgKey_EINKOMMEN_FINSIT_ABGELEHNT_ERSTGESUCH_MSG=Die Angaben der finanziellen Verhältnisse wurden nicht nachgewiesen, deshalb wird kein Gutschein aufgrund der finanziellen Verhältnisse gewährt (Art. 34p ASIV)
MsgKey_EINKOMMEN_FINSIT_ABGELEHNT_ERSTGESUCH_MSG_FKJV=Die Angaben der finanziellen Verhältnisse wurden nicht nachgewiesen, deshalb wird kein Gutschein gewährt (Art. 63 FKJV)
MsgKey_EINKOMMEN_FINSIT_ABGELEHNT_MUTATION_MSG=Die Angaben der finanziellen Verhältnisse wurden nicht nachgewiesen (Art. 34p ASIV). Es gelten weiterhin die finanziellen Verhältnisse der Verfügung vom {0}
MsgKey_EINKOMMEN_FINSIT_ABGELEHNT_MUTATION_MSG_FKJV=Die Angaben der finanziellen Verhältnisse wurden nicht nachgewiesen (Art. 63 FKJV). Es gelten weiterhin die finanziellen Verhältnisse der Verfügung vom {0}
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ACCEPT_MSG=Ihr Antrag zur Anwendung der Einkommensverschlechterung wurde gutgeheissen. Das massgebende Einkommen des Jahres {0} ohne Abzug des Pauschalbetrags gemäss Familiengrösse ist um mehr als {1} Prozent tiefer als das massgebende Einkommen des aktuellen Bemessungszeitraums (Jahr {2}) ohne Abzug des Pauschalbetrags gemäss Familiengrösse (Art. 34m Abs. 2 ASIV).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ACCEPT_MSG_FKJV=Ihr Antrag wegen Einkommensverschlechterung wurde gutgeheissen. Das anrechenbare Einkommen des Jahres {0} ist um mehr als {1} Prozent tiefer als das anrechenbare Einkommen des aktuellen Bemessungszeitraums (Jahr {2}) (Art. 57 Abs. 2 FKJV oder Art. 66 Abs. 1 Bst. k FKJV).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_NOT_ACCEPT_MSG=Ihr Antrag zur Anwendung der Einkommensverschlechterung wurde abgelehnt. Es gilt weiterhin das massgebende Einkommen des Jahres {2}. Das massgebende Einkommen des Jahres {0} ohne Abzug des Pauschalbetrags gemäss Familiengrösse ist nicht um mehr als {1} Prozent tiefer als das massgebende Einkommen des aktuellen Bemessungszeitraums (Jahr {2}) ohne Abzug des Pauschalbetrags gemäss Familiengrösse. (Art. 34m Abs. 2 ASIV).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_NOT_ACCEPT_MSG_FKJV=Ihr Antrag wegen Einkommensverschlechterung wurde abgelehnt. Es gilt weiterhin das massgebende Einkommen des Jahres {2}. Das anrechenbare Einkommen des Jahres {0} ist nicht um mehr als {1} Prozent tiefer als das massgebende Einkommen des aktuellen Bemessungszeitraums (Jahr {2}) ohne Abzug des Pauschalbetrags gemäss Familiengrösse. (Art. 57 Abs. 2 FKJV).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ANNULLIERT_MSG=Ihr Antrag zur Anwendung der Einkommensverschlechterung für das Jahr {0} wurde aufgrund der fehlenden Belege abgelehnt (Art. 27 Abs. 3 ASIV).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ANNULLIERT_MSG_FKJV=Ihr Antrag wegen Einkommensverschlechterung für das Jahr {0} wurde aufgrund der fehlenden Belege abgelehnt (Art. 63 FKJV).
MsgKey_EINKOMMEN_SOZIALHILFEEMPFAENGER_MSG=Sozialhilfebeziehende Eltern erhalten die maximale Vergünstigung pro Betreuungseinheit (Art 34l Abs 4).
MsgKey_EINKOMMEN_SOZIALHILFEEMPFAENGER_MSG_FKJV=Sozialhilfebeziehende Eltern erhalten die maximale Vergünstigung pro Betreuungseinheit (Art. 56 Abs. 4 FKJV).
MsgKey_ERWERBSPENSUM_FREIWILLIGENARBEIT=Für diesen Zeitraum wurde die Freiwilligenarbeit von {0}% gemäss Art. 9 FEBVO anerkannt.
MsgKey_EINKOMMEN_TOO_HIGH_FOR_EKV=Ihr Antrag wegen Einkommensverschlechterung wurde abgelehnt. Es gilt weiterhin das massgebende Einkommen des Jahres {0}. Das massgebende Einkommen des Jahres {0} ist höher als CHF {1} (Art. 57 Abs 2  und Art. 66 Abs. 1 Bst. k FKJV).
MsgKey_UNBEZAHLTER_URLAUB_MSG=Als erwerbstätig gelten auch Eltern bei einem unbezahlten Urlaub bis zu drei Monaten. Dauert der unbezahlte Urlaub länger als drei Monate ist diese Erwerbstätigkeit nicht mehr gegeben und das anspruchsberechtigte Pensum wird auf den Folgemonat entsprechend gekürzt (Art. 2 BGSDV und Art. 34h ASIV).
MsgKey_UNBEZAHLTER_URLAUB_MSG_FKJV=Als erwerbstätig gelten auch Erziehungsberechtigte bei einem unbezahlten Urlaub bis zu drei Monaten. Dauert der unbezahlte Urlaub länger als drei Monate, gilt die Person nicht mehr als erwerbstätig und das anspruchsberechtigte Pensum wird auf den Folgemonat entsprechend gekürzt (FKJV Art. 36 Abs. 1 Bst. A FKJV und Art. 3 Abs. 3 Bst. b FKJDV).
MsgKey_ERWERBSPENSUM_ANSPRUCH=Für diesen Zeitraum ergibt sich ein anspruchsberechtigtes Pensum aufgrund des Beschäftigungspensums ({0} - Art. 34d ASIV).
MsgKey_ERWERBSPENSUM_ANSPRUCH_FKJV=Für diesen Zeitraum ergibt sich ein anspruchsberechtigtes Pensum aufgrund des Beschäftigungspensums ({0} Art. 44 FKJV).
MsgKey_ERWERBSPENSUM_KEIN_ANSPRUCH=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (34b und 34e ASIV). Das minimale Beschäftigungspensum beträgt {0}%.
MsgKey_ERWERBSPENSUM_KEIN_ANSPRUCH_FKJV=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (Art. 38 FKJV). Das minimale Beschäftigungspensum beträgt {0}%.
MsgKey_ERWERBSPENSUM_EINGEWOEHNUNG=Für diesen Zeitraum ergibt sich ein anspruchsberechtigtes Pensum aufgrund der Eingewöhnung (Art. 36 Abs. 3 FKJV).
MsgKey_WOHNSITZ_MSG=Für diesen Zeitraum liegt kein zivilrechtlicher Wohnsitz in der Gemeinde {0} vor (Art. 34b Abs. 1 Bst. c ASIV). Daher besteht kein Anspruch auf einen Betreuungsgutschein.
MsgKey_WOHNSITZ_MSG_FKJV=Für diesen Zeitraum liegt kein zivilrechtlicher Wohnsitz in der Gemeinde {0} vor (Art. 62 Abs. 1 FKJV). Daher besteht kein Anspruch auf einen Betreuungsgutschein.
MsgKey_FACHSTELLE_MSG=Für diesen Zeitraum ist der Bedarf für die familienergänzende Betreuung aufgrund der {0} gegeben und durch die Fachstelle {1} bestätigt (Art. 34d ASIV und Art. 8 bis 10 BGSDV).
MsgKey_FACHSTELLE_MSG_FKJV=Für diesen Zeitraum ist der Bedarf für die familienergänzende Betreuung aufgrund der {0} gegeben und durch die Fachstelle {1} bestätigt (Art. 36 und Art. 45 FKJV).
MsgKey_FACHSTELLE_SPRACHLICHE_INTEGRATION_ZU_TIEF_MSG_FKJV=Für diesen Zeitraum ist der Bedarf für die familienergänzende Betreuung aufgrund der sprachlichen Indikation nicht gegeben da diese Betreuung weniger als {0}% beträgt (Art. 45 Abs. 1 Bst b FKJV).
MsgKey_AUSSERORDENTLICHER_ANSPRUCH_MSG=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (34b und 34e ASIV), aber die Wohnsitzgemeinde hat in diesem Fall eine begründete Ausnahme gemäss Art. 34d Abs. 2 ASIV gemacht.
MsgKey_AUSSERORDENTLICHER_ANSPRUCH_MSG_FKJV=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (Art. 38 FKJV), aber die Wohnsitzgemeinde hat in diesem Fall eine begründete Ausnahme gemäss Art. 37 Abs. 2 FKJV gemacht.
MsgKey_KEIN_AUSSERORDENTLICHER_ANSPRUCH_MSG=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt einer begründeten Ausnahme nicht erreicht (Art. 37 FKJV).
MsgKey_EINREICHUNGSFRIST_MSG=Für diesen Zeitraum wird noch kein Betreuungsgutschein ausgestellt. Der Betreuungsgutschein wird auf den Folgemonat nach Einreichung des vollständigen Antrags und ab Beginn des Betreuungsverhältnisses ausgestellt (Art. 34o ASIV).
MsgKey_EINREICHUNGSFRIST_MSG_FKJV=Für diesen Zeitraum wird noch kein Betreuungsgutschein ausgestellt. Der Betreuungsgutschein wird auf den Folgemonat nach Einreichung des vollständigen Antrags und ab Beginn des Betreuungsverhältnisses ausgestellt (Art. 62 Abs. 3 Bst. B FKJV).
MsgKey_REDUCKTION_RUECKWIRKEND_MSG=Ihre Anpassung hat eine Herabsetzung des anspruchsberechtigten Betreuungspensums zur Folge und erfolgt auf den Folgemonat des Eintretens des Anpassungsgrundes (Art. 34r Abs. 2 ASIV).
MsgKey_REDUCKTION_RUECKWIRKEND_MSG_FKJV=Ihre Anpassung hat eine Herabsetzung des anspruchsberechtigten Betreuungspensums zur Folge und erfolgt auf den Folgemonat des Eintretens des Anpassungsgrundes (Art. 67 Abs. 2 FKJV).
MsgKey_ANSPRUCHSAENDERUNG_MSG=Ihre Anpassung hat eine Erhöhung des Betreuungsgutscheins zur Folge, die Anpassung erfolgt auf den Folgemonat nach Einreichung aller Belege (Art 34r ASIV).
MsgKey_ANSPRUCHSAENDERUNG_MSG_FKJV=Ihre Anpassung hat eine Erhöhung des Betreuungsgutscheins zur Folge, die Anpassung erfolgt auf den Folgemonat nach Einreichung aller Belege (Art. 67 Abs. 1 FKJV).
MsgKey_ABWESENHEIT_MSG=Das Kind wird länger als {0} aufeinanderfolgende Kalendertage nicht familienergänzend betreut (z.B. aufgrund einer längeren Reise). Deshalb wird kein Betreuungsgutschein mehr ausbezahlt (Art. 34u Abs. 1).
MsgKey_ABWESENHEIT_MSG_FKJV=Das Kind wird länger als {0} aufeinanderfolgende Kalendertage nicht familienergänzend betreut (z.B. aufgrund einer längeren Reise). Deshalb wird kein Betreuungsgutschein mehr ausbezahlt (Art. 71 Abs. 1 FKJV).
MsgKey_SCHULSTUFE_KINDERGARTEN_2_MSG=Kein Anspruch für Kinder ab der ersten Klasse (Art. 34a Abs. 3 ASIV Bst. a ASIV).
MsgKey_SCHULSTUFE_KINDERGARTEN_2_MSG_FKJV=Kein Anspruch für Kinder ab der ersten Klasse (FKJV Art.30 Abs.1 Bst. a).
MsgKey_ERWEITERTE_BEDUERFNISSE_MSG=Die Voraussetzungen gemäss Artikel 11 BGSDV für den Erhalt der Pauschale für besondere Bedürfnisse sind gegeben.
MsgKey_ERWEITERTE_BEDUERFNISSE_MSG_FKJV=Die Voraussetzungen gemäss Artikel 42 FKJV für den Erhalt der Pauschale für besondere Bedürfnisse sind gegeben.
MsgKey_VERFUEGUNG_MIT_ANSPRUCH=Die Berechnung des Gutscheins (V) erfolgt gemäss Art. 34k ASIV sowie der Formel, welche im Anhang 1a der ASIV zu finden ist. Dabei wird auf das massgebende Einkommen gemäss Beilage 1 und das vergünstigte Betreuungspensum (III) abgestellt.
MsgKey_VERFUEGUNG_MIT_ANSPRUCH_FKJV=Die Berechnung des Gutscheins (V) erfolgt gemäss Art. 55 FKJV sowie der Formel, welche im Anhang 1 der FKJV zu finden ist. Dabei wird auf das massgebende Einkommen gemäss Beilage 1 und das vergünstigte Betreuungspensum (III) abgestellt.
MsgKey_FIN_SIT_RUECKWIRKEND_ANGEPASST=Die finanziellen Verhältnisse wurden angepasst. Das massgebende Einkommen wurde für die ganze Periode bzw. für die betroffene Zeitspanne neu berechnet (FKJV Art. 66 Abs. 1 Bst. h und Art. 68 Abs. 1). Die Differenz zu bereits ausbezahlten Betreuungsgutscheinen wird direkt mit den Antragsstellenden beglichen (SLG Art. 55 Abs. 1).
MsgKey_FACHSTELLE_SPRACHEFOEDERUNG_NICHT_BESTAETIGT_MSG=Aufgrund der fehlenden Betreuung in der Amtssprache durch einen geeigneten Leistungserbringer nach Art. 41 Abs. 3 ist der Anspruch aufgrund sprachlicher Indikation nicht gegeben.
MsgKey_KEIN_ANSPRUCH_KIND_TERMINIERT=Ihre Anpassung hat eine Herabsetzung des Betreuungsgutscheins zur Folge und erfolgt auf den Folgemonat des Eintretens des Anpassungsgrundes (Art. 67 Abs. 2 FKJV).

