PdfGeneration_NichtEintreten_Content_4=Im Verwaltungsverfahren gilt der Untersuchungsgrundsatz, d.h. die Behörden stellen den Sachverhalt von Amtes wegen fest (Art. 18 Abs. 1 VRPG
PdfGeneration_NichtEintreten_Content_5=). Der Untersuchungsgrundsatz wird indessen durch die Mitwirkungspflicht der Parteien eingeschränkt. Danach sind die Parteien verpflichtet, aktiv zur Ermittlung des Sachverhalts beizutragen. Die verantwortliche Behörde muss nicht Abklärungen treffen, wenn ein Sachumstand von einer Partei (durch Auskünfte, Unterlagen usw.) geklärt werden könnte, die Partei aber die mögliche und zumutbare Mitarbeit unterlässt. Die Mitwirkungspflicht gilt allgemein, wenn eine Partei aus einem Begehren Rechte ableitet (Art. 20 Abs. 1 VRPG), und sie ist als spezifische und umfassende Mitwirkungspflicht der Eltern in der Verordnung über die Angebote zur sozialen Integration verankert. Die für die Berechnung des Betreuungsgutscheins erforderlichen Angaben werden von den Eltern durch Selbstdeklaration erhoben. Die Eltern haben ihre Angaben durch die Einreichung der erforderlichen Belege nachzuweisen (Art. 34p, Abs. 1 ASIV
PdfGeneration_NichtEintreten_Content_5_FKJV=). Der Untersuchungsgrundsatz wird indessen durch die Mitwirkungspflicht der Parteien eingeschränkt. Danach sind die Parteien verpflichtet, aktiv zur Ermittlung des Sachverhalts beizutragen. Die verantwortliche Behörde muss nicht Abklärungen treffen, wenn ein Sachumstand von einer Partei (durch Auskünfte, Unterlagen usw.) geklärt werden könnte, die Partei aber die mögliche und zumutbare Mitarbeit unterlässt. Die Mitwirkungspflicht gilt allgemein, wenn eine Partei aus einem Begehren Rechte ableitet (Art. 20 Abs. 1 VRPG), und sie ist als spezifische und umfassende Mitwirkungspflicht der Erziehungsberechtigten in der Verordnung über die Angebote zur sozialen Integration verankert. Die für die Berechnung des Betreuungsgutscheins erforderlichen Angaben werden von den Erziehungsberechtigten durch Selbstdeklaration erhoben. Die Erziehungsberechtigten haben ihre Angaben durch die Einreichung der erforderlichen Belege nachzuweisen (Art. 63 FKJV)
PdfGeneration_NichtEintreten_Content_6=).
