MsgKey_EINKOMMENSVERSCHLECHTERUNG_NOT_ACCEPT_MSG=Votre demande pour faire valoir la baisse du revenu a été rejetée. Le revenu déterminant reste celui de l’année {2}. Le revenu déterminant pour l’année {0} sans déduction forfaitaire liée à la taille de la famille n’est pas inférieur de plus de {1} pour cent au revenu déterminant de la période de calcul actuelle (année {2}) sans ladite déduction (art. 34m, al. 2 OPIS).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ACCEPT_MSG=Votre demande pour faire valoir une baisse du revenu a été acceptée. Le revenu déterminant pour l’année {0} sans déduction forfaitaire liée à la taille de la famille est inférieur de plus de {1} pour cent au revenu déterminant de la période de calcul actuelle (année {2}) sans ladite déduction (art. 34m, al. 2 OPIS).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ACCEPT_MSG_FKJV=Votre demande pour faire valoir une baisse du revenu a été acceptée. Le revenu imputable pour l’année {0} est inférieur de plus de {1} pour cent au revenu imputable de la période de calcul actuelle (année {2}) sans ladite déduction (art. 57, al. 2 OEJF ou art. 66, al. 1 lit k OEJF).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_NOT_ACCEPT_MSG_FKJV=Votre demande pour faire valoir la baisse du revenu a été rejetée. Le revenu déterminant reste celui de l’année {2}. Le revenu imputable pour l’année {0}  n’est pas inférieur de plus de {1} pour cent au revenu imputable de la période de calcul actuelle (année {2})  (art. 57, al. 2 OEJF).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ANNULLIERT_MSG=Votre demande pour faire valoir la baisse du revenu pour l’année {0} a été rejetée faute de justificatifs (art. 27, al. 3 OPIS).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ANNULLIERT_MSG_FKJV=Votre demande pour faire valoir la baisse du revenu pour l’année {0} a été rejetée faute de justificatifs (art. 63 OEJF).
MsgKey_EINKOMMEN_SOZIALHILFEEMPFAENGER_MSG=La subvention maximale par unité de prise en charge est accordée aux parents bénéficiaires de l’aide sociale (art. 34l, al. 4 OPIS).
MsgKey_EINKOMMEN_SOZIALHILFEEMPFAENGER_MSG_FKJV=La subvention maximale par unité de prise en charge est accordée aux parents bénéficiaires de l’aide sociale (art. 56, al. 4 OEJF).
MsgKey_EINKOMMEN_TOO_HIGH_FOR_EKV=Votre demande pour cause de baisse du revenu a été rejetée. C’est le revenu déterminant {0} qui continue de s’appliquer et celui-ci est plus élevé que {1} francs (art. 57, al. 2 et art. 66, al 1 lit. k OEJF).
MsgKey_UNBEZAHLTER_URLAUB_MSG=Sont également considérés comme exerçant une activité lucrative les parents qui bénéficient d’un congé non payé d’une durée de trois mois au maximum. Si le congé non payé dure plus de trois mois, la condition d’exercice d’une activité lucrative n’est plus remplie, et le taux de prise en charge accordé est réduit en conséquence le mois suivant (art. 2 ODBG et art. 34h OPIS).
MsgKey_UNBEZAHLTER_URLAUB_MSG_FKJV=Sont également considérés comme exerçant une activité lucrative les personnes détenant l’autorité parentale qui bénéficient d’un congé non payé d’une durée de trois mois au maximum. Si le congé non payé dure plus de trois mois, la condition d’exercice d’une activité lucrative n’est plus remplie, et le taux de prise en charge accordé est réduit en conséquence le mois suivant (art. 36, al. 1 , lit. a OEJF et art. 3 al. 3, lit. b OEJF).
MsgKey_ERWERBSPENSUM_ANSPRUCH=Pour cette période, un taux de prise en charge est accordé en raison du taux d’activité ({0} - art. 34d OPIS).
MsgKey_ERWERBSPENSUM_ANSPRUCH_FKJV=Pour cette période, un taux de prise en charge est accordé en raison du taux d’activité ({0}  art. 44 OEJF).
MsgKey_ERWERBSPENSUM_FREIWILLIGENARBEIT=Pour cette période le bénévolat a été reconnu à {0}% selon l'article 9 FEBVO
MsgKey_ERWERBSPENSUM_KEIN_ANSPRUCH=Pour cette période, le taux d’activité minimal requis pour l’octroi d’un bon de garde n’est pas atteint (art. 37 ODBG). Le taux d’activité minimal est de {0}%.
MsgKey_ERWERBSPENSUM_KEIN_ANSPRUCH_FKJV=Pour cette période, le taux d’activité minimal requis pour l’octroi d’un bon de garde n’est pas atteint (art. 38 OEJF). Le taux d’activité minimal est de {0}%.
MsgKey_ERWERBSPENSUM_EINGEWOEHNUNG=En vertu de l’article 36, alinéa 3 OEJF, il est possible de bénéficier d’un taux de prise en charge admissible en raison de la période d’adaptation.
MsgKey_WOHNSITZ_MSG=Pour cette période, les parents ne sont pas domiciliés dans la commune de {0} (art. 34b, al. 1, lit. c OPIS). Il n’existe donc pas de droit à un bon de garde.
MsgKey_WOHNSITZ_MSG_FKJV=Pour cette période, les personnes détenant l’autorité parentale ne sont pas domiciliés dans la commune de {0} (art. 62, al. 1 OEJF). Il n’existe donc pas de droit à un bon de garde.
MsgKey_FACHSTELLE_MSG=Pour cette période, le besoin de prise en charge extrafamiliale en raison de {0} est établi et confirmé par le service spécialisé {1} (art. 34d OPIS et art. 8 à 10 ODBG).
MsgKey_FACHSTELLE_MSG_FKJV=Pour cette période, le besoin de prise en charge extrafamiliale en raison de {0} est établi et confirmé par le service spécialisé {1} (art. 36 et art. 45 OEJF).
MsgKey_FACHSTELLE_SPRACHLICHE_INTEGRATION_ZU_TIEF_MSG_FKJV=Pour cette période, le besoin de prise en charge extrafamiliale en raison d’indication de besoin linguistique n’est pas accordé car la prise en charge est seulement de {0}% (art. 45, al. 1, lit. b OEJF).
MsgKey_AUSSERORDENTLICHER_ANSPRUCH_MSG=Pour cette période, le taux d’activité minimal requis pour l’octroi d’un bon de garde n’est pas atteint (art. 34b et 34e OPIS), mais la commune de domicile a considéré ce cas comme une exception justifiée au sens de l’art. 34d, al. 2 OPIS.
MsgKey_AUSSERORDENTLICHER_ANSPRUCH_MSG_FKJV=Pour cette période, le taux d’activité minimal requis pour l’octroi d’un bon de garde n’est pas atteint (art. 38 OEJF), mais la commune de domicile a considéré ce cas comme une exception justifiée au sens de l’art. 37, al. 2 OEJF.
MsgKey_KEIN_AUSSERORDENTLICHER_ANSPRUCH_MSG=Le taux d’activité requis pour bénéficier du régime d’exception prévu à l’article 37 OEJF n’a pas été atteint pendant la période considérée.
MsgKey_EINREICHUNGSFRIST_MSG=Aucun bon de garde n’est encore délivré pour cette période. La commune de domicile établit le bon de garde pour le mois suivant le dépôt d’une demande complète et à partir du début de la prise en charge (art. 34o OPIS).
MsgKey_EINREICHUNGSFRIST_MSG_FKJV=Aucun bon de garde n’est encore délivré pour cette période. La commune de domicile établit le bon de garde pour le mois suivant le dépôt d’une demande complète et à partir du début de la prise en charge (art. 62, al. 3 lit. b OEJF).
MsgKey_REDUCKTION_RUECKWIRKEND_MSG=Votre changement de situation donne lieu à une baisse du taux de prise en charge accordé: l’adaptation est donc effective le mois suivant sa survenance (art. 34r, al. 2 OPIS).
MsgKey_REDUCKTION_RUECKWIRKEND_MSG_FKJV=Votre changement de situation donne lieu à une baisse du taux de prise en charge accordé: l’adaptation est donc effective le mois suivant sa survenance (art. 67, al.2 OEJF).
MsgKey_ANSPRUCHSAENDERUNG_MSG=Votre changement de situation donne lieu à une augmentation du bon: l’adaptation est donc effective le mois suivant la remise de l’ensemble des justificatifs requis (art. 34r OPIS).
MsgKey_ANSPRUCHSAENDERUNG_MSG_FKJV=Votre changement de situation donne lieu à une augmentation du bon: l’adaptation est donc effective le mois suivant la remise de l’ensemble des justificatifs requis (art. 67, al. 1 OEJF).
MsgKey_ABWESENHEIT_MSG=L’enfant est absent de la structure de garde pendant plus de 30 jours civils consécutifs (p. ex. en raison d’un long voyage). C’est pourquoi le versement du bon de garde est interrompu (art. 34u, al. 1 OPIS).
MsgKey_ABWESENHEIT_MSG_FKJV=L’enfant est absent de la structure de garde pendant plus de 30 jours civils consécutifs (p. ex. en raison d’un long voyage). C’est pourquoi le versement du bon de garde est interrompu (art. 71, al. 1 OEJF).
MsgKey_SCHULSTUFE_KINDERGARTEN_2_MSG=Pas de droit pour les enfants à compter de la 3e classe (art. 34a, al. 3, lit. a OPIS)
MsgKey_SCHULSTUFE_KINDERGARTEN_2_MSG_FKJV=Pas de droit pour les enfants à compter de la 3e classe (art. 30 al. 1, lit. a OEJF)
MsgKey_ERWEITERTE_BEDUERFNISSE_MSG_FKJV=Les conditions pour l’octroi d’un forfait pour frais de garde extraordinaires selon l’article 42 OEJF sont remplies.
MsgKey_VERFUEGUNG_MIT_ANSPRUCH_FKJV=Le montant des bons de garde (V) se calcule conformément à l’article 55 de l`OEJF et au moyen de la formule figurant à l’annexe 1 de l`OEJF . Il dépend du revenu déterminant (annexe 1) et du taux de prise en charge subventionné (III).
MsgKey_FIN_SIT_RUECKWIRKEND_ANGEPASST=La situation financière a été adaptée. Le revenu déterminant a été recalculé pour l’ensemble de la période de validité des bons ou pour la période concernée (art. 66, al. 1, lit. h et art. 68, al. 1 OEJF). La commune doit organiser le règlement de la différence avec le montant déjà versé pour les bons directement avec les auteurs de la demande (art. 55, al. 1 LPASoc).
MsgKey_KEIN_ANSPRUCH_KIND_TERMINIERT=L’adaptation donne lieu à une diminution du bon de garde et prend effet le mois suivant la survenance du motif (art. 67, al. 2 OEJF).

