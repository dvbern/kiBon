PdfGeneration_NichtEintreten_Fusszeile2=Ordonnance du 2 novembre 2011 sur les prestations d’insertion sociale (OPIS; RSB 860.113)
PdfGeneration_NichtEintreten_Fusszeile2_FKJV=Ordonnance du 24. novembre 2021 sur les programmes de soutien à l’enfance, à la jeunesse et à la famille (OEJF; RSB 860.22)
PdfGeneration_NichtEintreten_Content_4=Dans les procédures administratives, la maxime inquisitoire s’applique, c’est-à-dire que les autorités constatent les faits d’office (art. 18, al. 1 LPJA
PdfGeneration_NichtEintreten_Content_5=). Cependant, la maxime inquisitoire a pour limite l’obligation de collaborer des parties, qui veut que celles-ci contribuent activement à l’établissement des faits. L’autorité compétente n’est pas tenue de procéder à des investigations dès lors qu’un état de fait pourrait être clarifié par une partie (renseignements, documents, etc.), si celle-ci néglige son devoir de coopérer comme on peut raisonnablement l’attendre d’elle. Ce devoir de collaborer s’applique d’une manière générale lorsqu’une partie revendique un droit (art. 20, al. 1 LPJA), et il est ancré en tant qu’obligation spécifique et étendue des parents dans l’ordonnance sur les prestations d’insertion sociale (OPIS). Les parents communiquent dans une déclaration spontanée les données nécessaires au calcul du montant du bon de garde et présentent les justificatifs requis (art. 34p, al. 1 OPIS
PdfGeneration_NichtEintreten_Content_5_FKJV=). Cependant, la maxime inquisitoire a pour limite l’obligation de collaborer des parties, qui veut que celles-ci contribuent activement à l’établissement des faits. L’autorité compétente n’est pas tenue de procéder à des investigations dès lors qu’un état de fait pourrait être clarifié par une partie (renseignements, documents, etc.), si celle-ci néglige son devoir de coopérer comme on peut raisonnablement l’attendre d’elle. Ce devoir de collaborer s’applique d’une manière générale lorsqu’une partie revendique un droit (art. 20, al. 1 LPJA), et il est ancré en tant qu’obligation spécifique et étendue des personnes détenant l’autorité parentale dans l’ordonnance sur les prestations d’insertion sociale (OPIS).  Les personnes détenant l’autorité parentale communiquent dans une déclaration spontanée les données nécessaires au calcul du montant du bon de garde et présentent les justificatifs requis (art. 63 OEJF)
PdfGeneration_NichtEintreten_Content_6=).
PdfGeneration_NichtEintreten_Content_7=Si les parents refusent de collaborer, la demande est déclarée irrecevable (art. 20, al. 2 LPJA). Sur cette base, la décision suivante est rendue:
