MsgKey_SCHULSTUFE_FREIWILLIGER_KINDERGARTEN_MSG=Für Kinder ab dem obligatorischen Kindergartenjahr besteht kein Anspruch.
PdfGeneration_Begleitschreiben_Content=Wir haben Ihre Unterlagen, mit denen Sie Unterstützung für die familienergänzende Kinderbetreuung beantragen, geprüft.\n\nDie Ergebnisse bezüglich Ihres Antrags sind auf den folgenden Seiten ersichtlich.\n\nFalls Sie einen Betreuungsgutschein erhalten: Teilen Sie uns bitte Veränderungen in der Betreuung und der persönlichen sowie wirtschaftlichen Verhältnisse (Familiengrösse, Umzug, Anpassung des Erwerbspensums, unbezahlter Urlaub, Wechsel des Anbieters usw.) innert einer Woche auf kibon.ch mit.
