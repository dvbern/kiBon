PdfGeneration_EinwilligungSteuerdaten_Content=Mit dem Antrag wird das Sozialdepartement der Gemeinde Horw ermächtigt, beim Finanzderpartement (insbesondere Steuern) und den Arbeitgebenden die zur Berechnung des Gutscheins notwendigen Daten (massg. Einkommen und Vermögen, Erwerbseinkommen, Subventionierung usw.) unter Wahrung der Daten- und Persönlichkeitsschutzes zu ermitteln und diese auszutauschen. Es dürfen ausschliesslich Informationen ausgetauscht werden, die für die Ausstellung der Betreuungsgutscheine erforderlich sind. \n\nZur Erbringung von Supportleistungen und zur Wahrnehmung der Kontrollaufgaben ermächtigt/ermächtigen die unterzeichnende/n Person/en die zuständigen Mitarbeitenden des Sozialdepartementes der Gemeinde Horw sowie der Firma DV Bern AG zur Einsichtnahme in die Daten aus kiBon. Die Mitarbeitenden dürfen die Daten ausschliesslich zur Bearbeitung der Supportanfragen und im Rahmen von Kontrollen durch die Gemeinde verwenden. Die unterzeichnende/n Person/en sind damit einverstanden, dass die zuständigen Mitarbeitenden des Sozialdepartementes der Gemeinde Horw die Daten aus kiBon in anonymisierter Form zu statistischen Zwecken verwenden. Die unterzeichnenden Personen sind damit einverstanden, dass die betreuende Institution in kiBon die Betreuungskosten und die Dauer der Betreuung erfasst. Die Leistungserbringer sind berechtigt, die zur Bestätigung des Betreuungsverhältnisses erforderlichen Angaben aus dem Antrag einzusehen. Werden die Betreuungsgutscheine direkt an den Leistungserbringer ausbezahlt, hat dieser Zugriff auf die Bestätigung, mit der der Betreuungsgutschein gewährt wird. Sie entnimmt dieser den Gutscheinbetrag und bringt ihn auf der Rechnung in Abzug. Die betreuende Institution kann die finanziellen Verhältnisse der Familie nicht einsehen.
PdfGeneration_Verfuegung_Fusszeile1=Reglement über die Finanzierung der familienergänzenden Kinderbetreuung (Nr. 863)

MsgKey_ANSPRUCHSAENDERUNG_MSG=Ihre Anpassung hat eine Erhöhung des Betreuungsgutscheins zur Folge, die Anpassung erfolgt auf den Folgemonat nach Einreichung aller Belege (Art. 9 Abs. 5 Verordnung 866 BG Horw).
MsgKey_AUSSERORDENTLICHER_ANSPRUCH_MSG=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (Art. 3 Reglement 863 Finanzierung familienergänzende Kinderbetreuung Horw), aber die Wohnsitzgemeinde hat in diesem Fall eine begründete Ausnahme gemäss Art. 3 Abs. 3 Reglement 863 genehmigt.
MsgKey_EINKOMMEN_FINSIT_ABGELEHNT_MUTATION_MSG=Die Angaben der finanziellen Verhältnisse wurden nicht nachgewiesen (Art. 5 Verordnung 866 BG Horw). Es gelten weiterhin die finanziellen Verhältnisse der Verfügung vom {0}.
MsgKey_EINKOMMEN_MAX_MSG=Ab einem massgebenden Einkommen von {0} Franken erfolgt keine Vergünstigung mehr (Anhang 1 aus der Verordnung 866 BG Horw).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_NOT_ACCEPT_MSG=Ihr Antrag zur Anwendung der Einkommensänderung wurde abgelehnt. Es gilt weiterhin das massgebende Einkommen des Jahres {2}. Das massgebende Einkommen des Jahres {0} weicht nicht um mehr als {1} Prozent vom massgebenden Einkommen des aktuellen Bemessungszeitraums ab (Jahr {2}). (Art 8 Abs. 1 Verordnung 866 BG Horw).
MsgKey_EINKOMMENSVERSCHLECHTERUNG_ACCEPT_MSG=Ihr Antrag zur Anwendung der Einkommensänderung wurde gutgeheissen. Das massgebende Einkommen des Jahres {0} weicht um mehr als {1} Prozent vom massgebenden Einkommen des aktuellen Bemessungszeitraums ab (Jahr {2}) (Art 8 Abs. 1 Verordnung 866 BG Horw).
MsgKey_EINREICHUNGSFRIST_MSG=Für diesen Zeitraum wird noch kein Betreuungsgutschein ausgestellt. Der Betreuungsgutschein wird auf den Folgemonat nach Einreichung des vollständigen Antrags und ab Beginn des Betreuungsverhältnisses ausgestellt (Art. 9 Abs. 5 Verordnung 866 BG Horw).
MsgKey_ERWEITERTE_BEDUERFNISSE_MSG=Die Voraussetzungen für die Finanzierung des ausserordentlichen Betreuungsaufwands sind gemäss Art. 4 Verordnung 866 BG Horw gegeben.
MsgKey_ERWERBSPENSUM_ANSPRUCH=Für diesen Zeitraum ergibt sich ein anspruchsberechtigtes Pensum aufgrund des Beschäftigungspensums ({0}). (Art.3 Reglement 863 Finanzierung familienergänzende Kinderbetreuung Horw)
MsgKey_ERWERBSPENSUM_KEIN_ANSPRUCH=Für diesen Zeitraum ist das erforderliche Beschäftigungspensum für den Erhalt eines Betreuungsgutscheins nicht erreicht (Art. 3 lit. a Reglement 863 Finanzierung familienergänzende Kinderbetreuung Horw). Das minimale Beschäftigungspensum beträgt {0}%.
MsgKey_GESCHWSTERNBONUS_KIND_2=Für diesen Zeitraum haben Sie Anspruch auf ein Geschwisterbonus für das zweite Kind (Art. 6 Abs. 6 & 7 Verordnung 866 BG Horw).
MsgKey_GESCHWSTERNBONUS_KIND_3=Für diesen Zeitraum haben Sie Anspruch auf ein Geschwisterbonus für das dritte Kind (Art. 6 Abs. 6 & 7 Verordnung 866 BG Horw).
MsgKey_FACHSTELLE_MSG=Für diesen Zeitraum ist der Bedarf für die familienergänzende Betreuung aufgrund der {0} gegeben (Art. 4 Verordnung 866 BG Horw).
MsgKey_REDUCKTION_RUECKWIRKEND_MSG=Ihre Anpassung hat eine Herabsetzung des anspruchsberechtigten Betreuungspensums zur Folge und erfolgt auf den Folgemonat des Eintretens des Anpassungsgrundes.
MsgKey_SCHULSTUFE_KINDERGARTEN_2_MSG=Kein Anspruch für Kinder ab der ersten Klasse (Art. 2 Reglement 863 BG Horw).
MsgKey_VERFUEGUNG_MIT_ANSPRUCH=Die Berechnung des Gutscheins erfolgt gemäss Art. 6 sowie Anhang 1 & 3 Verordnung 866 BG Horw.
MsgKey_WOHNSITZ_MSG=Für diesen Zeitraum liegt kein zivilrechtlicher Wohnsitz in der Gemeinde {0} vor (Art. 2 Reglement 863 Finanzierung familienergänzende Kinderbetreuung Horw). Daher besteht kein Anspruch auf einen Betreuungsgutschein.

EinladungEmail_FOOTER=Wenn Sie Fragen zu kiBon haben, stehen Ihnen unsere Mitarbeitenden per Telefon (<a href="tel:+41 31 378 24 33">+41 31 378 24 33</a>) oder E-Mail (<a href="support@kibon.ch">support@kibon.ch</a>) zur Verfügung.<br><br>Freundliche Grüsse<br>kiBon - Team

