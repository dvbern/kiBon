MsgKey_KEIN_ANSPRUCH_KIND_TERMINIERT=Die Anpassung hat eine Herabsetzung des Betreuungsgutscheins zur Folge und erfolgt auf den Folgemonat des Eintretens des Anpassungsgrundes.

PdfGeneration_FinSit_AbzuegeLiegenschaften=Ausserordentlicher Liegenschaftsunterhalt
PdfGeneration_Begleitschreiben_Content_Mit_Gemeinde_Info=Sie haben ein Gesuch um Beiträge zur Kinderbetreuung eingereicht. Wir haben dieses geprüft. Die Ergebnisse können Sie auf den folgenden Seiten einsehen.\n\nFalls Sie Beiträge erhalten, sind Sie verpflichtet, uns wesentliche Änderungen umgehend mitzuteilen. Dazu zählen beispielsweise das Einkommen, die Familienverhältnisse und die Betreuungen Ihres Kindes.\n\nBei Fragen können Sie uns per Telefon {0} oder E-Mail {1} erreichen.
